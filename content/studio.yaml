# Studio: digital art (the drawings list), photography (the photos list), and music.
# Any list left empty hides its part of the section (and the whole section hides if everything is empty).
#
# Studio is the record's Side B: one numbered list (B1, B2, ...) across both groups, in the order below.
# Images go in public/studio/. For each one:
#   name:    short title shown in the list and as the viewer caption (working titles; edit freely)
#   title:   the full description: what a screen reader announces, shown under the large preview
#   image:   small thumbnail (phone rows; about 500 px tall is plenty)
#   preview: the large preview beside the list (fits 1320 x 1000; optional, falls back to image)
#   full:    the full-size file the viewer opens (optional)
#   width, height: the full image's pixel size. They set the shape, so nothing gets cropped.

drawings:
  - name: "Blue portrait"
    title: "Portrait study in blue pencil: a young man looking back over his shoulder"
    image: /studio/portrait-blue-thumb.webp
    preview: /studio/portrait-blue-preview.webp
