# Projects, in the order they appear.
#   featured: true  -> large card at the top of Projects. false -> compact row below.
#   label           -> the short tag under the name in the icon strip below the hero.
#   icon            -> a built-in icon (chart, calendar, database, chat, scatter, tag)
#                      or your own image path, e.g. /icons/hermes.png (put the file in public/icons/).
#   links           -> leave empty ([]) to show no link. Add {label, url} items when you have them.

- id: hermes
  name: hermes
  label: Trading bot
  icon: chart
  featured: true
  status: Ran on a droplet, March to April 2026
  summary: An autonomous paper-trading bot built on Claude, Gemini, and Alpaca.
  description: A paper-trading bot that ran unattended for two months. Every weekday at 9:45 ET it pulled prices and news, asked Claude and Gemini for a call on each ticker, merged the two calls, ran them through risk rules, and placed paper orders through Alpaca. It never touched real money.
  stack: [Python, Claude, Gemini, Alpaca, APScheduler, systemd]
  links:
    - label: Read the code on GitHub
      url: https://github.com/ennels/hermes

